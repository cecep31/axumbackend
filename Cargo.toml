[package]
name = "axumbackend"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.43", features = ["serde"] }
dotenvy = "0.15"
axum = { version = "0.8.9", features = ["multipart"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.20.0", features = ["v7", "serde"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
bcrypt = "0.19"
argon2 = "0.6"
rand = "0.10"
async-stream = "0.3"
tokio-stream = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "form", "query"] }
garde = { version = "0.23.0", features = ["derive", "email", "url"] }
sha2 = "0.10"
hex = "0.4"
